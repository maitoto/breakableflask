name: Automatisation des tests DevSecOps
on: push

jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      # L'étape checkout est indispensable pour récupérer les fichiers du repository
      - uses: actions/checkout@v4
        
      - name: Dependances
        run: |
          # 1° - Contrôle du fichier requirements.txt avec Trivy
          docker run --rm -v ${{ github.workspace }}:/workspace aquasec/trivy fs --scanners vuln /workspace/requirements.txt

  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - uses: actions/checkout@v4

      - name: Test Dockerfile
        run: |
          # 2° - Contrôle du fichier Dockerfile avec Trivy
          docker run --rm -v ${{ github.workspace }}:/workspace aquasec/trivy config /workspace/Dockerfile

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
